# DineEasy — development overrides.
# Usage: docker compose -f infrastructure/docker/docker-compose.yml -f infrastructure/docker/docker-compose.dev.yml up -d
#
# In day-to-day dev, most people run `npm run dev:api` / `npm run dev:web` on the host
# instead of dockerizing api/web, and only use this file for postgres+redis. This override
# is provided for parity testing ("does it work fully dockerized") and onboarding.

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineeasy}
      POSTGRES_USER: ${POSTGRES_USER:-dineeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    ports:
      - "6379:6379"

  api:
    build:
      target: development
    volumes:
      - ../../services/api:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:dev"]

  web:
    build:
      target: development
    # Mounted at the monorepo root (/repo, matching the Dockerfile's build context)
    # so live-editing shared_types also hot-reloads here.
    volumes:
      - ../..:/repo
      - /repo/node_modules
      - /repo/apps/customer_web/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-3000}/api/v1
    command: ["npm", "run", "dev", "--", "--host"]
    ports:
      - "5173:5173"
