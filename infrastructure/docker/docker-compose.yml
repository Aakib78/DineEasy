\
# DineEasy — base compose file (works standalone for a "restaurant PC" prod-like deployment)
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Combine with docker-compose.dev.yml for local development, or
# docker-compose.test.yml for the automated test environment.

name: dineeasy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineeasy}
      POSTGRES_USER: ${POSTGRES_USER:-dineeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dineeasy_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineeasy} -d ${POSTGRES_DB:-dineeasy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dineeasy_redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dineeasy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dineeasy}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  web:
    build:
      context: ../../apps/customer_web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - dineeasy_lan

volumes:
  dineeasy_postgres_data:
  dineeasy_redis_data:

networks:
  dineeasy_lan:
    driver: bridge
