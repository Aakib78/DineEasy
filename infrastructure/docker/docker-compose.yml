# DineEasy — base compose file (works standalone for a "restaurant PC" prod-like deployment)
# Usage: docker compose -f infrastructure/docker/docker-compose.yml up -d
# Combine with docker-compose.dev.yml for local development, or
# docker-compose.test.yml for the automated test environment.

name: dineeasy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dineeasy}
      POSTGRES_USER: ${POSTGRES_USER:-dineeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - dineeasy_postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dineeasy} -d ${POSTGRES_DB:-dineeasy}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dineeasy_redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dineeasy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dineeasy}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/system/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dineeasy_lan

  web:
    build:
      # Root context (not apps/customer_web) — this image depends on the local workspace
      # package packages/shared_types, which npm can only resolve if the whole workspace
      # tree is visible in the build context. See apps/customer_web/Dockerfile's header
      # comment and docs/troubleshooting.md.
      context: ../..
      dockerfile: apps/customer_web/Dockerfile
      args:
        # Vite bakes env vars into the static bundle at BUILD time, not runtime — so this has
        # to be a build arg, not a container `environment:` entry (which would silently do
        # nothing for a pre-built nginx-served SPA). IMPORTANT: `localhost` only works if
        # you're testing from the server itself — a diner's phone needs the server's actual
        # LAN IP here (e.g. http://192.168.1.50:3000/api/v1), set via API_URL in your .env.
        VITE_API_BASE_URL: ${API_URL:-http://localhost:3000}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - dineeasy_lan

  pos:
    build:
      # Same root-context reasoning as `web` above — this image also depends on the local
      # workspace package packages/shared_types.
      context: ../..
      dockerfile: apps/pos_web/Dockerfile
      args:
        VITE_API_BASE_URL: ${API_URL:-http://localhost:3000}/api/v1
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${POS_WEB_PORT:-8081}:80"
    networks:
      - dineeasy_lan

volumes:
  dineeasy_postgres_data:
  dineeasy_redis_data:

networks:
  dineeasy_lan:
    driver: bridge
